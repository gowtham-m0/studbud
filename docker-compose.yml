services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: studbud
      POSTGRES_PASSWORD: studbud
      POSTGRES_DB: studbud
    ports:
      - "5432:5432"
    volumes:
      - studbud_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studbud -d studbud"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  studbud_db:
