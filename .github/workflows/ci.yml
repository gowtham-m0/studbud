name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: studbud
          POSTGRES_PASSWORD: studbud
          POSTGRES_DB: studbud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studbud -d studbud"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check src tests scripts
      - name: Format check
        run: uv run ruff format --check src tests scripts
      - name: Run tests
        run: uv run pytest -q
        env:
          DATABASE_URL: postgresql+asyncpg://studbud:studbud@127.0.0.1:5432/studbud

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: studbud
          POSTGRES_PASSWORD: studbud
          POSTGRES_DB: studbud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studbud -d studbud"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://studbud:studbud@127.0.0.1:5432/studbud
      KEY_PEPPER: ci-only-pepper
      ADMIN_API_SECRET: dev-admin-secret-change-me
      FRONTEND_ORIGINS: http://localhost:3000
      AUTO_CREATE_TABLES: "false"
      WORKER_ENABLED: "true"
      PLAYWRIGHT_CHANNEL: bundled
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - name: Install backend
        working-directory: backend
        run: uv sync --frozen
      - name: Generate sample PDF
        working-directory: backend
        run: uv run python tests/make_sample_pdf.py
      - name: Run migrations
        working-directory: backend
        run: uv run alembic upgrade head
      - name: Start backend
        working-directory: backend
        run: |
          nohup uv run uvicorn studbud_backend.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/healthz > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/api.log
          exit 1
      - name: Install frontend
        working-directory: frontend/web
        run: npm ci
      - name: Install browser
        working-directory: frontend/web
        run: npx playwright install --with-deps chromium
      - name: Configure frontend API URL
        working-directory: frontend/web
        run: cp .env.example .env.local
      - name: Build frontend
        working-directory: frontend/web
        run: npm run build
      - name: Start frontend
        working-directory: frontend/web
        run: |
          nohup npm start -- --hostname localhost --port 3000 > /tmp/web.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:3000/sign-in > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/web.log
          exit 1
      - name: Run UI flow
        working-directory: frontend/web
        run: node scripts/screenshots.mjs
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studbud-ui-screenshots
          path: .impeccable/review/next
          if-no-files-found: ignore
